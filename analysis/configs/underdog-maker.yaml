# underdog maker (docs/strategies/underdog-maker.md). Run with:
#   cd analysis && uv run polydata bt run configs/underdog-maker.yaml --days 2026-11-24 [--latency-sweep] [--set params.band_lo=0.25 ...]
strategy: underdog-maker
params:
  timeframes: [5m]
  start_tau_s: 300      # quote from this many seconds before the window end
  stop_tau_s: 120       # ... until this many (cancel then)
  band_lo: 0.15         # underdog's mid band
  band_hi: 0.35
  max_spread: 0.02      # book spread cap (wide books are fake prices)
  size: 10              # shares, one position per market
  check_ms: 1000
coins: [btc, eth, sol, xrp, bnb, doge, hype, zec]
timeframes: [5m]
day_kinds: [train]
days: [2026-11-24]
