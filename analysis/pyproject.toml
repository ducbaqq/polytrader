[project]
name = "polydata"
version = "0.1.0"
description = "Analysis toolkit for polytrader recorder data (DuckDB over Parquet)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.10",
    "duckdb>=2.0.1",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pycryptodome>=4.6.0",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "zstandard>=0.25.0",
]

[project.scripts]
polydata = "polydata.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
